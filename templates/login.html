{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block login %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h1>📖 Magazine Accounts</h1>
  <form method="post">
    <p><label>Username</label><input name="username" required autofocus style="width:100%"></p>
    <p><label>Password</label><input name="password" type="password" required style="width:100%"></p>
    <button class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
